name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "android/**"
      - "samples/HACKER4.S3M"
      - "iplay.png"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare native dependencies and assets
        run: ./android/prepare.sh
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK contents
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libmain.so'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/HACKER4.S3M'
      - uses: actions/upload-artifact@v4
        with:
          name: InertiaPlayer-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: InertiaPlayer-android-debug
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r apk/app-debug.apk
            adb shell am start -W -n com.xor2003.inertiaplayer/.MainActivity
            sleep 8
            adb shell pidof com.xor2003.inertiaplayer
            adb logcat -d | grep -E 'InertiaPlayer|SDL' | tail -n 80
