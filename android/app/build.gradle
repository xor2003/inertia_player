plugins {
    id "com.android.application"
}

android {
    namespace "com.xor2003.inertiaplayer"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.xor2003.inertiaplayer"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared"
            }
        }
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/sdl-java"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
